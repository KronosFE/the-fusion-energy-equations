<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560"><rect width="940" height="560" fill="#12233f"/><text x="56" y="50" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="bold" fill="#e8eef7">The breeding lever, not a surplus</text><text x="56" y="76" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#9db3cf">Tritium breeding as ratified — marginal by default, expandable by design. Each tier is a priced design choice, never a headline.</text><line x1="110" y1="464.0" x2="870" y2="464.0" stroke="#2c4466"/><text x="100" y="468.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">0.0</text><line x1="110" y1="421.0" x2="870" y2="421.0" stroke="#2c4466"/><text x="100" y="425.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">0.2</text><line x1="110" y1="378.0" x2="870" y2="378.0" stroke="#2c4466"/><text x="100" y="382.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">0.4</text><line x1="110" y1="335.0" x2="870" y2="335.0" stroke="#2c4466"/><text x="100" y="339.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">0.6</text><line x1="110" y1="292.0" x2="870" y2="292.0" stroke="#2c4466"/><text x="100" y="296.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">0.8</text><line x1="110" y1="249.0" x2="870" y2="249.0" stroke="#2c4466"/><text x="100" y="253.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">1.0</text><line x1="110" y1="206.0" x2="870" y2="206.0" stroke="#2c4466"/><text x="100" y="210.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">1.2</text><line x1="110" y1="163.0" x2="870" y2="163.0" stroke="#2c4466"/><text x="100" y="167.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">1.4</text><line x1="110" y1="120.0" x2="870" y2="120.0" stroke="#2c4466"/><text x="100" y="124.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">1.6</text><text x="30" y="292" transform="rotate(-90 30 292)" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#e8eef7">tritium breeding ratio (TBR)</text><rect x="171.7" y="236.1" width="130" height="6.5" fill="#d9b463"/><rect x="171.7" y="242.6" width="130" height="221.4" fill="#d9b463" opacity="0.25"/><text x="236.7" y="226.1" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="14" font-weight="bold" fill="#e8eef7">1.03–1.06</text><text x="236.7" y="486" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#e8eef7">Literal recipe</text><text x="236.7" y="504" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="9.5" fill="#9db3cf">Be 9.6–11.8 vol% · ~0.29 kg-T/yr</text><rect x="425.0" y="206.0" width="130" height="6.0" fill="#7fb0e0"/><rect x="425.0" y="210.3" width="130" height="253.7" fill="#7fb0e0" opacity="0.25"/><text x="490.0" y="196.0" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="14" font-weight="bold" fill="#e8eef7">1.18–1.20</text><text x="490.0" y="486" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#e8eef7">5 cm solid-Be layer</text><text x="490.0" y="504" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="9.5" fill="#9db3cf">same lever, pulled harder · ~0.9 kg-T/yr</text><rect x="678.3" y="158.7" width="130" height="6.0" fill="#6bbf95"/><rect x="678.3" y="163.0" width="130" height="301.0" fill="#6bbf95" opacity="0.25"/><text x="743.3" y="148.7" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="14" font-weight="bold" fill="#e8eef7">1.42</text><text x="743.3" y="486" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#e8eef7">Advanced ceiling</text><text x="743.3" y="504" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="9.5" fill="#9db3cf">best solid-Be reference · ~2.0 kg-T/yr (BR-L2-A7u)</text><line x1="110" y1="249.0" x2="870" y2="249.0" stroke="#e0895a" stroke-width="2" stroke-dasharray="7 5"/><text x="864" y="265.0" text-anchor="end" font-family="system-ui,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e0895a">replacement · TBR = 1</text><text x="490" y="131" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="12.5" fill="#9db3cf">OpenMC on ENDF/B-VIII.0 · gates BR-L2-A7 / A7u · surplus = (TBR − 1) × 4.76 kg-T per full-power year</text></svg>