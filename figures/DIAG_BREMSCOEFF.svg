<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520"><rect width="940" height="520" fill="#12233f"/><text x="64" y="48" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="bold" fill="#a9c6ea">Getting the electron&#8211;electron term exactly right</text><text x="64" y="72" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#9db3cf">The corrected bremsstrahlung coefficient raises radiated power a few percent across the band — and the balance still holds.</text><line x1="90" y1="428.0" x2="890" y2="428.0" stroke="#2c4466"/><text x="82" y="432.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">0</text><line x1="90" y1="372.0" x2="890" y2="372.0" stroke="#2c4466"/><text x="82" y="376.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">2</text><line x1="90" y1="316.0" x2="890" y2="316.0" stroke="#2c4466"/><text x="82" y="320.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">4</text><line x1="90" y1="260.0" x2="890" y2="260.0" stroke="#2c4466"/><text x="82" y="264.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">6</text><line x1="90" y1="204.0" x2="890" y2="204.0" stroke="#2c4466"/><text x="82" y="208.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">8</text><line x1="90" y1="148.0" x2="890" y2="148.0" stroke="#2c4466"/><text x="82" y="152.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">10</text><text x="90.0" y="446" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">20</text><text x="213.1" y="446" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">40</text><text x="336.2" y="446" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">60</text><text x="459.2" y="446" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">80</text><text x="582.3" y="446" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">100</text><text x="705.4" y="446" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">120</text><text x="828.5" y="446" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">140</text><polyline points="90.0,363.6 213.1,310.4 336.2,271.2 459.2,237.6 582.3,206.8 705.4,176.0 890.0,150.8" fill="none" stroke="#a9c6ea" stroke-width="3"/><text x="34" y="274" transform="rotate(-90 34 274)" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#e8eef7">bremsstrahlung increase on corrected coefficient (%)</text><text x="490" y="468" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#e8eef7">temperature  T  (keV)</text><rect x="120" y="140" width="330" height="120" rx="6" fill="#1b3050" stroke="#2c4466"/><text x="138" y="174" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#a9c6ea">c_ee = 5(44 − 3π²) / (24√2) = <tspan font-weight="bold" fill="#d9b463">2.120022</tspan></text><text x="138" y="204" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#9db3cf">circulated form uses 2 for √2:</text><text x="138" y="224" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#9db3cf">5(44 − 3π²)/48 = 1.499</text><text x="138" y="244" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">ratio = √2 — no conclusion changes</text></svg>