<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440"><rect width="940" height="440" fill="#12233f"/><text x="56" y="48" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="bold" fill="#a9c6ea">Fusing sensors buys 47 ms of quench warning, not 3</text><text x="56" y="72" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#9db3cf">Normal-zone warning lead time by method — fusing fiber-optic strain with magnetization dwarfs a bare voltage threshold.</text><rect x="330" y="130.8" width="472.0" height="41.7" fill="#6bbf95"/><text x="318" y="155.7" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#e8eef7">Fused FBG + magnetization</text><text x="810.0" y="155.7" font-family="'IBM Plex Mono',Menlo,monospace" font-size="13" font-weight="bold" fill="#e8eef7">47.2 ms</text><rect x="330" y="214.2" width="367.0" height="41.7" fill="#d9b463"/><text x="318" y="239.0" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#e8eef7">Terminal-voltage (ML)</text><text x="705.0" y="239.0" font-family="'IBM Plex Mono',Menlo,monospace" font-size="13" font-weight="bold" fill="#e8eef7">36.7 ms</text><rect x="330" y="297.5" width="26.0" height="41.7" fill="#e0895a"/><text x="318" y="322.3" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#e8eef7">Terminal-voltage (threshold)</text><text x="364.0" y="322.3" font-family="'IBM Plex Mono',Menlo,monospace" font-size="13" font-weight="bold" fill="#e8eef7">2.6 ms</text><text x="330.0" y="378" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">0</text><text x="430.0" y="378" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">10</text><text x="530.0" y="378" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">20</text><text x="630.0" y="378" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">30</text><text x="730.0" y="378" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">40</text><text x="830.0" y="378" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">50</text><text x="590" y="400" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#e8eef7">normal-zone warning lead time (ms)</text></svg>