<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470"><rect width="940" height="470" fill="#12233f"/><text x="56" y="50" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="bold" fill="#a9c6ea">The ledger closes on measured tube efficiencies</text><text x="56" y="76" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#9db3cf">Direct-conversion efficiency by stage — the design adopts the conservative measured ion-collector value, not a hoped-for one.</text><rect x="280" y="136.1" width="396.1" height="32.2" fill="#d9b463"/><line x1="676.1" y1="152.2" x2="827.9" y2="152.2" stroke="#e8eef7" stroke-width="1.3"/><line x1="827.9" y1="147.2" x2="827.9" y2="157.2" stroke="#e8eef7" stroke-width="1.3"/><text x="270" y="156.2" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">ion collector (Venetian-blind)</text><text x="682.1" y="146.2" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" font-weight="bold" fill="#e8eef7">0.470</text><text x="682.1" y="167.2" font-family="system-ui,Arial,sans-serif" font-size="9.5" font-weight="700" fill="#d9b463">ADOPTED</text><rect x="280" y="200.6" width="425.6" height="32.2" fill="#9db3cf"/><line x1="705.6" y1="216.8" x2="752.0" y2="216.8" stroke="#e8eef7" stroke-width="1.3"/><line x1="752.0" y1="211.8" x2="752.0" y2="221.8" stroke="#e8eef7" stroke-width="1.3"/><text x="270" y="220.8" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">thermionic topping (end-wall)</text><text x="711.6" y="210.8" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" font-weight="bold" fill="#e8eef7">0.505</text><rect x="280" y="265.1" width="379.3" height="32.2" fill="#9db3cf"/><line x1="659.3" y1="281.2" x2="701.4" y2="281.2" stroke="#e8eef7" stroke-width="1.3"/><line x1="701.4" y1="276.2" x2="701.4" y2="286.2" stroke="#e8eef7" stroke-width="1.3"/><text x="270" y="285.2" text-anchor="end" font-family="Geor