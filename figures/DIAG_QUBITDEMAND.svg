<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540"><rect width="880" height="540" fill="#12233f"/><text x="56" y="48" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="bold" fill="#a9c6ea">What each kernel would actually demand</text><text x="56" y="72" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#9db3cf">Logical qubits needed per kernel, against today&#8217;s frontier of a few dozen — the materials kernel alone asks for over a thousand.</text><line x1="100" y1="444.0" x2="820" y2="444.0" stroke="#2c4466"/><text x="92" y="448.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">10</text><line x1="100" y1="376.8" x2="820" y2="376.8" stroke="#2c4466"/><text x="92" y="380.8" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">30</text><line x1="100" y1="303.2" x2="820" y2="303.2" stroke="#2c4466"/><text x="92" y="307.2" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">100</text><line x1="100" y1="236.0" x2="820" y2="236.0" stroke="#2c4466"/><text x="92" y="240.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">300</text><line x1="100" y1="162.4" x2="820" y2="162.4" stroke="#2c4466"/><text x="92" y="166.4" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">1,000</text><rect x="100" y="345.6" width="720" height="98.4" fill="#6bbf95" opacity="0.08"/><text x="814" y="361.6" text-anchor="end" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#6bbf95">today&#8217;s frontier ≈ tens of logical qubits</text><rect x="160.0" y="260.8" width="120" height="183.2" fill="#a9c6ea"/><text x="220.0" y="252.8" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="15" font-weight="bold" fill="#e8eef7">200</text><text x="220.0" y="464.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">K1</text><text x="220.0" y="479.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">Vlasov / kinetic</text><rect x="400.0" y="345.6" width="120" height="98.4" fill="#e0895a"/><text x="460.0" y="337.6" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="15" font-weight="bold" fill="#e8eef7">50</text><text x="460.0" y="464.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">K2</text><text x="460.0" y="479.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">equilibrium linear solve</text><rect x="640.0" y="161.2" width="120" height="282.8" fill="#6b4a86"/><text x="700.0" y="153.2" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="15" font-weight="bold" fill="#e8eef7">1,020</text><text x="700.0" y="464.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">K3</text><text x="700.0" y="479.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">first-wall materials</text><text x="34" y="282" transform="rotate(-90 34 282)" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#e8eef7">logical qubits required (log)</text></svg>