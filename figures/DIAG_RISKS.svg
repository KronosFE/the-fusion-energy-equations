<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470"><rect width="980" height="470" fill="#12233f"/><text x="48" y="52" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="bold" fill="#a9c6ea">Commercialization as a sequence of retired risks</text><text x="48" y="78" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#9db3cf">Not one leap of faith — a chain of specific risks, each retired before the next is allowed to matter.</text><rect x="48.0" y="120" width="129.0" height="210" rx="7" fill="#1b3050" stroke="#2c4466" stroke-width="1.3"/><rect x="48.0" y="120" width="129.0" height="34" rx="7" fill="#a9c6ea"/><text x="112.5" y="143" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="14" letter-spacing="1" fill="#12233f">2026</text><text x="112.5" y="190" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15.5" font-weight="bold" fill="#e8eef7">Physics risk</text><line x1="64.0" y1="185" x2="161.0" y2="185" stroke="#e0895a" stroke-width="2"/><text x="112.5" y="212" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9" letter-spacing="2" fill="#6bbf95">RETIRED</text><text x="112.5" y="238" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">solved on paper,</text><text x="112.5" y="255" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">open-access,</text><text x="112.5" y="272" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">reproducible</text><line x1="180.0" y1="225.0" x2="196.0" y2="225.0" stroke="#d9b463" stroke-width="2.5"/><path d="M196.0,225.0 l-9,-5 l0,10 z" fill="#d9b463"/><rect x="199.0" y="120" width="129.0" height="210" rx="7" fill="#1b3050" stroke="#2c4466" stroke-width="1.3"/><rect x="199.0" y="120" width="129.0" height="34" rx="7" fill="#a9c6ea"/><text x="263.5" y="143" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="14" letter-spacing="1" fill="#12233f">2030</text><text x="263.5" y="190" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15.5" font-weight="bold" fill="#e8eef7">Materials risk</text><line x1="215.0" y1="185" x2="312.0" y2="185" stroke="#e0895a" stroke-width="2"/><text x="263.5" y="212" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9" letter-spacing="2" fill="#6bbf95">RETIRED</text><text x="263.5" y="238" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">the breeder makes</text><text x="263.5" y="255" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">tritium &amp;</text><text x="263.5" y="272" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">helium-3 — revenue,</text><text x="263.5" y="289" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">not slides</text><line x1="331.0" y1="225.0" x2="347.0" y2="225.0" stroke="#d9b463" stroke-width="2.5"/><path d="M347.0,225.0 l-9,-5 l0,10 z" fill="#d9b463"/><rect x="350.0" y="120" width="129.0" height="210" rx="7" fill="#1b3050" stroke="#2c4466" stroke-width="1.3"/><rect x="350.0" y="120" width="129.0" height="34" rx="7" fill="#a9c6ea"/><text x="414.5" y="143" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="14" letter-spacing="1" fill="#12233f">2032</text><text x="414.5" y="190" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15.5" font-weight="bold" fill="#e8eef7">Burner-physics risk</text><line x1="366.0" y1="185" x2="463.0" y2="185" stroke="#e0895a" stroke-width="2"/><text x="414.5" y="212" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9" letter-spacing="2" fill="#6bbf95">RETIRED</text><text x="414.5" y="238" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">the ~100 MW test</text><text x="414.5" y="255" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">unit proves the</text><text x="414.5" y="272" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">mirror in hardware</text><line x1="482.0" y1="225.0" x2="498.0" y2="225.0" stroke="#d9b463" stroke-width="2.5"/><path d="M498.0,225.0 l-9,-5 l0,10 z" fill="#d9b463"/><rect x="501.0" y="120" width="129.0" height="210" rx="7" fill="#1b3050" stroke="#2c4466" stroke-width="1.3"/><rect x="501.0" y="120" width="129.0" height="34" rx="7" fill="#a9c6ea"/><text x="565.5" y="143" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="14" letter-spacing="1" fill="#12233f">2036</text><text x="565.5" y="190" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15.5" font-weight="bold" fill="#e8eef7">The-unit risk</text><line x1="517.0" y1="185" x2="614.0" y2="185" stroke="#e0895a" stroke-width="2"/><text x="565.5" y="212" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9" letter-spacing="2" fill="#6bbf95">RETIRED</text><text x="565.5" y="238" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">a financeable ~1 GW</text><text x="565.5" y="255" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">machine that a grid</text><text x="565.5" y="272" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">can plan around</text><line x1="633.0" y1="225.0" x2="649.0" y2="225.0" stroke="#d9b463" stroke-width="2.5"/><path d="M649.0,225.0 l-9,-5 l0,10 z" fill="#d9b463"/><rect x="652.0" y="120" width="129.0" height="210" rx="7" fill="#1b3050" stroke="#2c4466" stroke-width="1.3"/><rect x="652.0" y="120" width="129.0" height="34" rx="7" fill="#a9c6ea"/><text x="716.5" y="143" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="14" letter-spacing="1" fill="#12233f">2040</text><text x="716.5" y="190" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15.5" font-weight="bold" fill="#e8eef7">Fuel risk</text><line x1="668.0" y1="185" x2="765.0" y2="185" stroke="#e0895a" stroke-width="2"/><text x="716.5" y="212" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9" letter-spacing="2" fill="#6bbf95">RETIRED</text><text x="716.5" y="238" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">lunar helium-3</text><text x="716.5" y="255" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">lifts the cap on</text><text x="716.5" y="272" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">how many can run</text><line x1="784.0" y1="225.0" x2="800.0" y2="225.0" stroke="#d9b463" stroke-width="2.5"/><path d="M800.0,225.0 l-9,-5 l0,10 z" fill="#d9b463"/><rect x="803.0" y="120" width="129.0" height="210" rx="7" fill="#1b3050" stroke="#2c4466" stroke-width="1.3"/><rect x="803.0" y="120" width="129.0" height="34" rx="7" fill="#a9c6ea"/><text x="867.5" y="143" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="14" letter-spacing="1" fill="#12233f">2050</text><text x="867.5" y="190" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15.5" font-weight="bold" fill="#e8eef7">Scale risk</text><line x1="819.0" y1="185" x2="916.0" y2="185" stroke="#e0895a" stroke-width="2"/><text x="867.5" y="212" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9" letter-spacing="2" fill="#6bbf95">RETIRED</text><text x="867.5" y="238" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">the learning curve</text><text x="867.5" y="255" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">holds to a ~90 GW</text><text x="867.5" y="272" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">fleet</text><text x="490.0" y="386" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="15" fill="#a9c6ea">A believable business is not one big bet. It is a queue of small, dated, falsifiable ones.</text></svg>