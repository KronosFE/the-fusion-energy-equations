<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470"><rect width="980" height="470" fill="#12233f"/><text x="56" y="44" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="bold" fill="#a9c6ea">A small 14 MeV group drives the shielding</text><text x="56" y="68" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#9db3cf">The D–T secondary is only 9.5% of neutrons but 37.6% of the power — and it thickens the shield by nearly half.</text><text x="280.0" y="120" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="bold" fill="#a9c6ea">Number vs power in the neutron field</text><text x="82" y="384.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9.5" fill="#9db3cf">0.0</text><line x1="90" y1="380.0" x2="470" y2="380.0" stroke="#2c4466"/><text x="82" y="334.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9.5" fill="#9db3cf">0.2</text><line x1="90" y1="330.0" x2="470" y2="330.0" stroke="#2c4466"/><text x="82" y="284.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9.5" fill="#9db3cf">0.4</text><line x1="90" y1="280.0" x2="470" y2="280.0" stroke="#2c4466"/><text x="82" y="234.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9.5" fill="#9db3cf">0.6</text><line x1="90" y1="230.0" x2="470" y2="230.0" stroke="#2c4466"/><text x="82" y="184.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9.5" fill="#9db3cf">0.8</text><line x1="90" y1="180.0" x2="470" y2="180.0" stroke="#2c4466"/><text x="82" y="134.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9.5" fill="#9db3cf">1.0</text><line x1="90" y1="130.0" x2="470" y2="130.0" stroke="#2c4466"/><rect x="137.0" y="153.8" width="42" height="226.2" fill="#a9c6ea"/><text x="158.0" y="147.8" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10.5" font-weight="bold" fill="#e8eef7">90.5%</text><rect x="185.0" y="224.0" width="42" height="156.0" fill="#e0895a"/><text x="206.0" y="218.0" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10.5" font-weight="bold" fill="#e8eef7">62.4%</text><text x="185.0" y="396.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#e8eef7">2.45 MeV</text><text x="185.0" y="409.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#e8eef7">(D–D)</text><rect x="327.0" y="356.2" width="42" height="23.8" fill="#a9c6ea"/><text x="348.0" y="350.2" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10.5" font-weight="bold" fill="#e8eef7">9.5%</text><rect x="375.0" y="286.0" width="42" height="94.0" fill="#e0895a"/><text x="396.0" y="280.0" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10.5" font-weight="bold" fill="#e8eef7">37.6%</text><text x="375.0" y="396.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#e8eef7">14.06 MeV</text><text x="375.0" y="409.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#e8eef7">(D–T sec.)</text><rect x="100" y="136" width="12" height="12" fill="#a9c6ea"/><text x="116" y="146" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#e8eef7">number fraction</text><rect x="220" y="136" width="12" height="12" fill="#e0895a"/><text x="236" y="146" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#e8eef7">power fraction</text><text x="765.0" y="120" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="bold" fill="#a9c6ea">Shield thickness for 10⁻⁶ attenuation</text><text x="592" y="384.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9.5" fill="#9db3cf">0.0</text><line x1="600" y1="380.0" x2="930" y2="380.0" stroke="#2c4466"/><text x="592" y="300.7" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9.5" fill="#9db3cf">0.5</text><line x1="600" y1="296.7" x2="930" y2="296.7" stroke="#2c4466"/><text x="592" y="217.3" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9.5" fill="#9db3cf">1.0</text><line x1="600" y1="213.3" x2="930" y2="213.3" stroke="#2c4466"/><text x="592" y="134.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9.5" fill="#9db3cf">1.5</text><line x1="600" y1="130.0" x2="930" y2="130.0" stroke="#2c4466"/><rect x="642.5" y="230.3" width="80" height="149.7" fill="#9db3cf"/><text x="682.5" y="224.3" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" font-weight="bold" fill="#e8eef7">0.898 m</text><text x="682.5" y="396.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#e8eef7">pure 2.45 MeV</text><text x="682.5" y="409.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#e8eef7">(costing)</text><rect x="807.5" y="160.3" width="80" height="219.7" fill="#e0895a"/><text x="847.5" y="154.3" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" font-weight="bold" fill="#e8eef7">1.318 m</text><text x="847.5" y="396.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#e8eef7">mixed field</text><text x="847.5" y="409.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#e8eef7">(actual)</text><text x="765" y="143" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#e0895a">+47% thickness</text></svg>