<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600"><rect width="980" height="600" fill="#12233f"/><text x="96" y="52" font-family="Georgia,'Times New Roman',serif" font-size="25" font-weight="bold" fill="#a9c6ea">Qubits arrive before the advantage does</text><text x="96" y="78" font-family="Georgia,'Times New Roman',serif" font-size="14.5" fill="#9db3cf">Vendor roadmaps cross our kernels&#8217; qubit thresholds around 2030 — but a threshold crossed is necessary, not sufficient.</text><rect x="96" y="104" width="414" height="400" fill="#1b3050" stroke="#2c4466"/><line x1="96" y1="504.0" x2="510" y2="504.0" stroke="#2c4466" stroke-width="1"/><text x="84" y="508.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" fill="#9db3cf">10</text><line x1="96" y1="340.7" x2="510" y2="340.7" stroke="#2c4466" stroke-width="1"/><text x="84" y="344.7" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" fill="#9db3cf">100</text><line x1="96" y1="177.5" x2="510" y2="177.5" stroke="#2c4466" stroke-width="1"/><text x="84" y="181.5" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" fill="#9db3cf">1,000</text><text x="28" y="304" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#e8eef7" transform="rotate(-90 28 304)" text-anchor="middle">logical qubits (log scale)</text><line x1="96.0" y1="504" x2="96.0" y2="510" stroke="#9db3cf" stroke-width="1"/><text x="96.0" y="528" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" fill="#9db3cf">2028</text><line x1="199.5" y1="504" x2="199.5" y2="510" stroke="#9db3cf" stroke-width="1"/><text x="199.5" y="528" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" fill="#9db3cf">2030</text><line x1="303.0" y1="504" x2="303.0" y2="510" stroke="#9db3cf" stroke-width="1"/><text x="303.0" y="528" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" fill="#9db3cf">2032</text><line x1="406.5" y1="504" x2="406.5" y2="510" stroke="#9db3cf" stroke-width="1"/><text x="406.5" y="528" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" fill="#9db3cf">2034</text><line x1="510.0" y1="504" x2="510.0" y2="510" stroke="#9db3cf" stroke-width="1"/><text x="510.0" y="528" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" fill="#9db3cf">2036</text><text x="303" y="556" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#e8eef7">calendar year</text><line x1="96" y1="322.1" x2="510" y2="322.1" stroke="#d9b463" stroke-width="2" stroke-dasharray="7 5"/><line x1="96" y1="327.8" x2="510" y2="327.8" stroke="#d9b463" stroke-width="2" stroke-dasharray="7 5"/><line x1="96" y1="398.9" x2="510" y2="398.9" stroke="#9db3cf" stroke-width="2" stroke-dasharray="7 5"/><text x="502" y="316.9" text-anchor="end" font-family="system-ui,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#d9b463">kernel threshold band · ~120–130</text><text x="502" y="390.9" text-anchor="end" font-family="system-ui,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#9db3cf">easiest kernel · 44</text><circle cx="147.8" cy="322.1" r="8" fill="#e0895a"/><text x="147.8" y="307.1" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#e8eef7">IBM 2029</text><circle cx="354.8" cy="128.3" r="8" fill="#e0895a"/><text x="354.8" y="113.3" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#e8eef7">IBM 2033</text><rect x="192.5" y="333.7" width="14" height="14" fill="#7fb0e0"/><text x="211.5" y="344.7" text-anchor="start" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#e8eef7">Google 2030</text><rect x="451.2" y="170.5" width="14" height="14" fill="#7fb0e0"/><text x="458.2" y="162.5" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#e8eef7">Google 2035</text><path d="M199.5,340.8 l9,16 l-18,0 z" fill="#6bbf95"/><text x="199.5" y="373.8" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#e8eef7">Quantinuum 2030</text><text x="544" y="110" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="#d9b463">VENDOR ROADMAPS</text><circle cx="552" cy="132" r="7" fill="#e0895a"/><text x="570" y="136" font-family="system-ui,Arial,sans-serif" font-size="12.5" fill="#e8eef7">IBM</text><rect x="546" y="150" width="13" height="13" fill="#7fb0e0"/><text x="570" y="160" font-family="system-ui,Arial,sans-serif" font-size="12.5" fill="#e8eef7">Google</text><path d="M552,173 l8,14 l-16,0 z" fill="#6bbf95"/><text x="570" y="184" font-family="system-ui,Arial,sans-serif" font-size="12.5" fill="#e8eef7">Quantinuum</text><rect x="544" y="230" width="402" height="182" rx="6" fill="#1b3050" stroke="#d9b463" stroke-width="1.5"/><text x="560" y="258" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="#d9b463">NECESSARY, NOT SUFFICIENT</text><text x="560" y="282" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">Even where a roadmap reaches a</text><text x="560" y="299" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">kernel's qubit count, the fault-</text><text x="560" y="316" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">tolerant T-count runtime still</text><text x="560" y="333" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">loses to a classical solver.</text><text x="560" y="350" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7"></text><text x="560" y="367" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">No result in this book depends on</text><text x="560" y="384" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">a quantum computer.</text></svg>