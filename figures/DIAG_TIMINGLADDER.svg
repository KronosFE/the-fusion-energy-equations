<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520"><rect width="980" height="520" fill="#12233f"/><text x="56" y="48" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="bold" fill="#a9c6ea">Every control layer acts on its own clock</text><text x="56" y="72" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#9db3cf">From a hardware failsafe in microseconds to fleet learning over years — measured latencies sit inside each layer&#8217;s band.</text><line x1="230.0" y1="110" x2="230.0" y2="440" stroke="#2c4466"/><text x="230.0" y="458" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">1e-7</text><line x1="328.6" y1="110" x2="328.6" y2="440" stroke="#2c4466"/><text x="328.6" y="458" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">1e-5</text><line x1="427.1" y1="110" x2="427.1" y2="440" stroke="#2c4466"/><text x="427.1" y="458" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">1e-3</text><line x1="525.7" y1="110" x2="525.7" y2="440" stroke="#2c4466"/><text x="525.7" y="458" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">1e-1</text><line x1="624.3" y1="110" x2="624.3" y2="440" stroke="#2c4466"/><text x="624.3" y="458" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">1e1</text><line x1="722.9" y1="110" x2="722.9" y2="440" stroke="#2c4466"/><text x="722.9" y="458" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">1e3</text><line x1="821.4" y1="110" x2="821.4" y2="440" stroke="#2c4466"/><text x="821.4" y="458" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">1e5</text><line x1="920.0" y1="110" x2="920.0" y2="440" stroke="#2c4466"/><text x="920.0" y="458" text-anchor="middle" font-family="'IBM P