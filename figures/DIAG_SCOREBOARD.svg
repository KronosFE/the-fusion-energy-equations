<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400"><rect width="940" height="400" fill="#12233f"/><text x="56" y="52" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="bold" fill="#a9c6ea">The acceptance-gate scoreboard, scored against us</text><text x="56" y="78" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#9db3cf">Sixteen pre-registered deliverables, marked honestly — the clamp keeps the system auditable-as-safe even where models miss their bars.</text><rect x="64.0" y="140" width="453.8" height="64" fill="#2f6f8f"/><text x="290.9" y="179.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="bold" fill="#ffffff">9</text><rect x="520.8" y="140" width="200.0" height="64" fill="#e0895a"/><text x="620.8" y="179.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="bold" fill="#ffffff">4</text><rect x="723.8" y="140" width="98.5" height="64" fill="#d9b463"/><text x="773.0" y="179.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="bold" fill="#ffffff">2</text><rect x="825.2" y="140" width="47.8" height="64" fill="#6b4a86"/><text x="849.1" y="179.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="bold" fill="#ffffff">1</text><rect x="64" y="242" width="15" height="15" fill="#2f6f8f"/><text x="86" y="254" font-family="system-ui,Arial,sans-serif" font-size="12.5" fill="#e8eef7">PASS (n=9)</text><rect x="166" y="242" width="15" height="15" fill="#e0895a"/><text x="188" y="254" font-family="system-ui,Arial,sans-serif" font-size="12.5" fill="#e8eef7">MISS (n=4)</text><rect x="268" y="242" width="15" height="15" fill="#d9b463"/><text x="290" y="254" font-family="system-ui,Arial,sans-serif" font-size="12.5" fill="#e8eef7">MET* (adverse / disclosure) (n=2)</text><rect x="554" y="242" width="15" height="15" fill="#6b4a86"/><text x="576" y="254" font-family="system-ui,Arial,sans-serif" font-size="12.5" fill="#e8eef7">PARTIAL (n=1)</text><text x="470" y="304" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="14" fill="#a9c6ea">Four honest misses, printed next to nine passes — a scoreboard that hides nothing is the point.</text></svg>