<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460"><rect width="940" height="460" fill="#12233f"/><text x="40" y="50" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="bold" fill="#a9c6ea">The one equation that decides everything</text><text x="470.0" y="150" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#e8eef7">CRF &#215; Capital  +  Fixed O&amp;M  +  Fuel</text><line x1="180" y1="172" x2="760" y2="172" stroke="#a9c6ea" stroke-width="2.5"/><text x="470.0" y="205" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#e8eef7">8,760 hours  &#215;  Power  &#215;  Capacity factor</text><text x="90" y="180" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="bold" fill="#d9b463">LCOE =</text><circle cx="60" cy="245" r="5" fill="#d9b463"/><text x="80" y="250" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#a9c6ea">Direct conversion</text><text x="80" y="268" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#9db3cf">attacks the top: keeps energy on the wire, not up the cooling tower</text><circle cx="60" cy="290" r="5" fill="#d9b463"/><text x="80" y="295" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#a9c6ea">Learning curve</text><text x="80" y="313" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#9db3cf">grinds the capital term down as the fleet repeats</text><circle cx="60" cy="335" r="5" fill="#a4462e"/><text x="80" y="340" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#a9c6ea">Cheap lunar He-3</text><text x="80" y="358" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#9db3cf">collapses the fuel term — the switch that can kill the number</text><circle cx="60" cy="380" r="5" fill="#9db3cf"/><text x="80" y="385" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#a9c6ea">Firmness (~90%)</text><text x="80" y="403" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#9db3cf">fills the denominator with the hours intermittent sources miss</text><text x="470.0" y="440" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="13" letter-spacing="3" fill="#d9b463">TARGET  ~$40 / MWh  ·  FIRM &amp; CLEAN</text></svg>