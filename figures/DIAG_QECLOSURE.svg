<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560"><rect width="880" height="560" fill="#12233f"/><text x="56" y="48" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="bold" fill="#a9c6ea">The expander is a bounded upside, not the closure</text><text x="56" y="72" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#9db3cf">Axial electric recovery, made explicit — adding the novel expander lifts output ~13%, but Q_E barely moves.</text><line x1="110" y1="450.0" x2="820" y2="450.0" stroke="#2c4466"/><text x="102" y="454.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">0</text><line x1="110" y1="376.7" x2="820" y2="376.7" stroke="#2c4466"/><text x="102" y="380.7" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">200</text><line x1="110" y1="303.3" x2="820" y2="303.3" stroke="#2c4466"/><text x="102" y="307.3" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">400</text><line x1="110" y1="230.0" x2="820" y2="230.0" stroke="#2c4466"/><text x="102" y="234.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">600</text><line x1="110" y1="156.7" x2="820" y2="156.7" stroke="#2c4466"/><text x="102" y="160.7" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">800</text><text x="34" y="285" transform="rotate(-90 34 285)" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#e8eef7">axial electric recovery (MWe)</text><rect x="230.0" y="329.0" width="150" height="121.0" fill="#e0895a"/><rect x="230.0" y="187.1" width="150" height="141.9" fill="#9db3cf"/><text x="305.0" y="179.1" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="14" font-weight="bold" fill="#e8eef7">717 MWe</text><text x="305.0" y="395.0" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#ffffff">Q_E 1.0023</text><text x="305.0" y="470" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">baseline</text><text x="305.0" y="486" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#9db3cf">(ion DEC + thermal)</text><rect x="500.0" y="329.0" width="150" height="121.0" fill="#e0895a" opacity="1"/><rect x="500.0" y="253.8" width="150" height="75.2" fill="#6bbf95" opacity="1"/><rect x="500.0" y="151.2" width="150" height="102.7" fill="#9db3cf" opacity="0.55"/><text x="575.0" y="143.2" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="14" font-weight="bold" fill="#e8eef7">815 MWe</text><text x="575.0" y="395.0" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#ffffff">Q_E 1.0026</text><text x="575.0" y="470" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">+ quasineutral</text><text x="575.0" y="486" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#9db3cf">expander DEC</text><text x="664.0" y="167.7" font-family="system-ui,Arial,sans-serif" font-size="12" font-weight="700" fill="#6bbf95">+97 MWe (+13%)</text><text x="465" y="544" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="12.5" fill="#9db3cf">Q_E is gated by plug / thermal-barrier recirculation, not by the converter.</text></svg>