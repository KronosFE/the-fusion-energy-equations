<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470"><rect width="940" height="470" fill="#12233f"/><text x="40" y="50" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="bold" fill="#a9c6ea">Two machines, function first — and wildly different in scale</text><text x="200" y="120" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="#d9b463">BREEDER · HYPERION</text><ellipse cx="200" cy="250" rx="70" ry="95" fill="none" stroke="#a9c6ea" stroke-width="2"/><rect x="190" y="155" width="20" height="190" fill="#9db3cf" opacity="0.5"/><ellipse cx="200" cy="250" rx="42" ry="70" fill="#d9b463" opacity="0.18"/><text x="200" y="380" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#e8eef7">~1.2 m major radius</text><text x="200" y="400" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#9db3cf">makes fuel · net −79 MWe</text><text x="470.0" y="235" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#d9b463">fuel →</text><line x1="300" y1="250" x2="440" y2="250" stroke="#d9b463" stroke-width="2" stroke-dasharray="5 4"/><path d="M440,250 l-10,-5 l0,10 z" fill="#d9b463"/><text x="690" y="120" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="#d9b463">BURNER · AEGIS / METROVOLT</text><rect x="480" y="242" width="420" height="16" rx="8" fill="#9db3cf" opacity="0.35"/><rect x="476" y="234" width="16" height="32" fill="#a9c6ea"/><rect x="888" y="234" width="16" height="32" fill="#a9c6ea"/><ellipse cx="690" cy="250" rx="200" ry="5" fill="#d9b463" opacity="0.5"/><text x="690" y="300" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#e8eef7">~440 m end to end</text><text x="690" y="320" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#9db3cf">makes firm power · Q_E ≈ 1.318 · f_n ≈ 5.44%</text><text x="470.0" y="400" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="15" fill="#a9c6ea">The breeder is barely a metre across. The burner is nearly half a kilometre long.</text><text x="470.0" y="424" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#9db3cf">Same program, opposite shapes — because fuel and power are opposite jobs.</text></svg>