<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470"><rect width="900" height="470" fill="#12233f"/><text x="40" y="52" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="bold" fill="#a9c6ea">A field guide to the four Q’s</text><text x="40" y="78" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#9db3cf">Four different ratios, four different jobs — and only one of them is the number a first unit prints.</text><rect x="40" y="110" width="820" height="68" rx="4" fill="#1b3050" stroke="#d8d2c4"/><text x="62" y="140" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="bold" font-style="italic" fill="#a9c6ea">Q_sci</text><text x="62" y="164" font-family="'IBM Plex Mono',Menlo,monospace" font-size="15" fill="#d9b463">≈ 3.076</text><text x="190" y="138" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#e8eef7">Fusion power ÷ plasma heating</text><text x="190" y="160" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#9db3cf">Breeder — solved on paper</text><rect x="600" y="134" width="236" height="20" rx="3" fill="#eae4d6"/><rect x="600" y="134" width="71" height="20" rx="3" fill="#9db3cf"/><rect x="40" y="192" width="820" height="68" rx="4" fill="#1b3050" stroke="#d8d2c4"/><text x="62" y="222" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="bold" font-style="italic" fill="#a9c6ea">Q_p</text><text x="62" y="246" font-family="'IBM Plex Mono',Menlo,monospace" font-size="15" fill="#d9b463">≈ 3.5</text><text x="190" y="220" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#e8eef7">Fusion power ÷ injected power</text><text x="190" y="242" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#9db3cf">Burner — first closure</text><rect x="600" y="216" width="236" height="20" rx="3" fill="#eae4d6"/><rect x="600" y="216" width="78" height="20" rx="3" fill="#9db3cf"/><rect x="40" y="274" width="820" height="68" rx="4" fill="#1b3050" stroke="#d8d2c4"/><text x="62" y="304" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="bold" font-style="italic" fill="#a9c6ea">Q_E</text><text x="62" y="328" font-family="'IBM Plex Mono',Menlo,monospace" font-size="15" fill="#d9b463">≈ 1.318</text><text x="190" y="302" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#e8eef7">Gross electricity ÷ recirculating</text><text x="190" y="324" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#9db3cf">Burner — engineering gain</text><rect x="600" y="298" width="236" height="20" rx="3" fill="#eae4d6"/><rect x="600" y="298" width="31" height="20" rx="3" fill="#9db3cf"/><rect x="40" y="356" width="820" height="68" rx="4" fill="#1b3050" stroke="#d8d2c4"/><text x="62" y="386" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="bold" font-style="italic" fill="#a9c6ea">Q40</text><text x="62" y="410" font-family="'IBM Plex Mono',Menlo,monospace" font-size="15" fill="#d9b463">= 40</text><text x="190" y="384" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#e8eef7">The title's target return</text><text x="190" y="406" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#9db3cf">The destination, not a receipt</text><rect x="600" y="380" width="236" height="20" rx="3" fill="#eae4d6"/><rect x="600" y="380" width="236" height="20" rx="3" fill="#d9b463"/><text x="40" y="460" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="13" fill="#9db3cf">The gap between 1.318 today and 40 at the summit is not a crack in the argument — it is the argument.</text></svg>