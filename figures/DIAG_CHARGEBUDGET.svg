<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" fill="#12233f"/><text x="56" y="50" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="bold" fill="#a9c6ea">Pure D–D fails on the budget, not the confinement</text><text x="56" y="76" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#9db3cf">At the burner design point, pure deuterium&#8217;s charged power cannot fund its own axial loss — a shortfall no length can close.</text><line x1="130" y1="421.0" x2="700" y2="421.0" stroke="#2c4466"/><text x="120" y="425.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">500</text><line x1="130" y1="337.0" x2="700" y2="337.0" stroke="#2c4466"/><text x="120" y="341.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">1000</text><line x1="130" y1="253.1" x2="700" y2="253.1" stroke="#2c4466"/><text x="120" y="257.1" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">2000</text><line x1="130" y1="169.1" x2="700" y2="169.1" stroke="#2c4466"/><text x="120" y="173.1" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">4000</text><text x="34" y="284" transform="rotate(-90 34 284)" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#e8eef7">power (MW, log scale)</text><rect x="207.5" y="380.7" width="130" height="67.3" fill="#d9b463"/><text x="272.5" y="372.7" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="15" font-weight="bold" fill="#e8eef7">697 MW</text><text x="272.5" y="468" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">charged power</text><text x="272.5" y="483" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">available</text><rect x="492.5" y="167.5" width="130" height="280.5" fill="#e0895a"/><text x="557.5" y="159.5" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="15" font-weight="bold" fill="#e8eef7">4055 MW</text><text x="557.5" y="468" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">axial loss</text><text x="557.5" y="483" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">to fund</text><line x1="557.5" y1="380.7" x2="557.5" y2="167.5" stroke="#e0895a" stroke-width="1.4" stroke-dasharray="4 3"/><text x="714" y="274.1" font-family="Georgia,'Times New Roman',serif" font-size="20" font-weight="bold" fill="#e0895a">5.8&#215;</text><text x="714" y="296.1" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#e0895a">shortfall</text><text x="415" y="500" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="12.5" fill="#9db3cf">The ratio is length-independent — this is a fuel-choice problem, not a confinement one.</text></svg>