<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560"><rect width="940" height="560" fill="#12233f"/><text x="56" y="50" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="bold" fill="#e8eef7">The helium-3 arithmetic that points at the Moon</text><text x="56" y="76" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#9db3cf">A breeder&#8217;s equilibrium output against one burner&#8217;s appetite — the loop does not close indigenously, and that is the whole argument.</text><line x1="120" y1="420.7" x2="860" y2="420.7" stroke="#2c4466"/><text x="110" y="424.7" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">1</text><line x1="120" y1="303.3" x2="860" y2="303.3" stroke="#2c4466"/><text x="110" y="307.3" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">10</text><line x1="120" y1="186.0" x2="860" y2="186.0" stroke="#2c4466"/><text x="110" y="190.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">100</text><text x="34" y="293" transform="rotate(-90 34 293)" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#e8eef7">helium-3 (kg per year, log)</text><rect x="220.0" y="426.0" width="170" height="30.0" fill="#d9b463"/><text x="305.0" y="416.0" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="15" font-weight="bold" fill="#e8eef7">0.9 kg</text><text x="305.0" y="478" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#e8eef7">One breeder supplies</text><text x="305.0" y="496" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10" fill="#9db3cf">surplus-tritium decay at equilibrium · BR-OUT-2</text><rect x="590.0" y="158.9" width="170" height="297.1" fill="#e0895a"/><text x="675.0" y="148.9" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="15" font-weight="bold" fill="#e8eef7">170.2 kg</text><text x="675.0" y="478" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#e8eef7">One burner consumes</text><text x="675.0" y="496" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10" fill="#9db3cf">per full-power year, net of D–D recycle · BR-OUT-4</text><text x="490" y="251" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="14" fill="#e0895a">&#8776;192 breeders per burner at the literal lever — lunar supply is the fleet gate (~2038–40)</text></svg>