<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540"><rect width="940" height="540" fill="#12233f"/><text x="64" y="48" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="bold" fill="#a9c6ea">In simulation it converges; add noise and it walls</text><text x="64" y="72" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#9db3cf">Materials VQE energy error per iteration — the ideal machine reaches chemical accuracy; a realistic noise model never does.</text><rect x="90" y="110" width="800" height="340" fill="#1b3050" stroke="#2c4466"/><line x1="90" y1="450.0" x2="890" y2="450.0" stroke="#2c4466"/><text x="82" y="454.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">10⁻³</text><line x1="90" y1="393.3" x2="890" y2="393.3" stroke="#2c4466"/><text x="82" y="397.3" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">10⁻²</text><line x1="90" y1="336.7" x2="890" y2="336.7" stroke="#2c4466"/><text x="82" y="340.7" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">10⁻¹</text><line x1="90" y1="280.0" x2="890" y2="280.0" stroke="#2c4466"/><text x="82" y="284.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">1</text><line x1="90" y1="223.3" x2="890" y2="223.3" stroke="#2c4466"/><text x="82" y="227.3" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">10</text><line x1="90" y1="166.7" x2="890" y2="166.7" stroke="#2c4466"/><text x="82" y="170.7" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">100</text><line x1="90" y1="110.0" x2="890" y2="110.0" stroke="#2c4466"/><text x="82" y="114.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">1000</text><text x="90.0" y="468" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">0</text><text x="242.4" y="468" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">20</text><text x="394.8" y="468" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">40</text><text x="547.1" y="468" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">60</text><text x="699.5" y="468" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">80</text><text x="851.9" y="468" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">100</text><polyline points="90.0,213.4 112.9,139.6 135.7,181.4 158.6,232.1 189.0,240.4 227.1,285.5 257.6,319.6 303.3,376.3 349.0,450.0 890.0,450.0" fill="none" stroke="#6bbf95" stroke-width="2.6"/><polyline points="90.0,206.3 112.9,139.6 135.7,186.3 166.2,192.5 242.4,196.3 318.6,193.2 432.9,198.0 547.1,194.7 699.5,196.3 890.0,196.3" fill="none" stroke="#e0895a" stroke-width="2.6"/><line x1="90" y1="280.0" x2="890" y2="280.0" stroke="#e0895a" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.7"/><text x="884" y="274.0" text-anchor="end" font-family="system-ui,Arial,sans-serif" font-size="11" font-weight="700" fill="#e0895a">chemical accuracy (1 kcal/mol)</text><text x="34" y="280" transform="rotate(-90 34 280)" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#e8eef7">energy error (kcal/mol, log)</text><text x="490" y="490" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#e8eef7">VQE iteration</text><line x1="390" y1="126" x2="416" y2="126" stroke="#6bbf95" stroke-width="3"/><text x="422" y="130" font-family="system-ui,Arial,sans-serif" font-size="11.5" fill="#e8eef7">ideal statevector</text><line x1="390" y1="148" x2="416" y2="148" stroke="#e0895a" stroke-width="3"/><text x="422" y="152" font-family="system-ui,Arial,sans