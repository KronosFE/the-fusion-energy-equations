<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" fill="#12233f"/><text x="450.0" y="50" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" letter-spacing="4" fill="#d9b463">WHY THE ROAD RUNS THROUGH THE MOON</text><rect x="70.0" y="140" width="170" height="150" rx="6" fill="#1b3050" stroke="#9db3cf" stroke-width="1.2"/><text x="155.0" y="180" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="18" font-weight="bold" fill="#a9c6ea">Regolith</text><text x="155.0" y="210" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">He-3 salted in over</text><text x="155.0" y="228" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">billions of years, a few</text><text x="155.0" y="246" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">parts per billion</text><line x1="246.0" y1="215.0" x2="260.6666666666667" y2="215.0" stroke="#d9b463" stroke-width="2.5"/><path d="M260.6666666666667,215.0 l-9,-5 l0,10 z" fill="#d9b463"/><rect x="266.66666666666663" y="140" width="170" height="150" rx="6" fill="#1b3050" stroke="#9db3cf" stroke-width="1.2"/><text x="351.66666666666663" y="180" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="18" font-weight="bold" fill="#a9c6ea">Extraction</text><text x="351.66666666666663" y="210" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">bake the soil to a few</text><text x="351.66666666666663" y="228" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">hundred °C to release the</text><text x="351.66666666666663" y="246" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">gas</text><line x1="442.66666666666663" y1="215.0" x2="457.3333333333333" y2="215.0" stroke="#d9b463" stroke-width="2.5"/><path d="M457.3333333333333,215.0 l-9,-5 l0,10 z" fill="#d9b463"/><rect x="463.3333333333333" y="140" width="170" height="150" rx="6" fill="#1b3050" stroke="#9db3cf" stroke-width="1.2"/><text x="548.3333333333333" y="180" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="18" font-weight="bold" fill="#a9c6ea">Transit</text><text x="548.3333333333333" y="210" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">fuel so energy-dense a</text><text x="548.3333333333333" y="228" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">year’s supply fits in</text><text x="548.3333333333333" y="246" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">your arms</text><line x1="639.3333333333333" y1="215.0" x2="653.9999999999999" y2="215.0" stroke="#d9b463" stroke-width="2.5"/><path d="M653.9999999999999,215.0 l-9,-5 l0,10 z" fill="#d9b463"/><rect x="660.0" y="140" width="170" height="150" rx="6" fill="#1b3050" stroke="#9db3cf" stroke-width="1.2"/><text x="745.0" y="180" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="18" font-weight="bold" fill="#a9c6ea">Fleet</text><text x="745.0" y="210" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">~170 kg per full-power</text><text x="745.0" y="228" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">year feeds one burner</text><text x="450.0" y="360" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#e8eef7">Earth makes about <tspan fill="#a9c6ea">2 kg</tspan> of helium-3 a year. One burner needs <tspan fill="#a9c6ea">~170 kg/fpy</tspan>.</text><text x="450.0" y="392" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#e8eef7">The Moon holds <tspan fill="#a9c6ea">hundreds of thousands of tonnes</tspan>. That is the whole reason to go.</text><text x="450.0" y="452" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="#6d82a0">EARLY UNITS RUN ON THE BREEDER’S TRICKLE · FLEET SCALE WAITS ON LUNAR SUPPLY (~2040)</text></svg>