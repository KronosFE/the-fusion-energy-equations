<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540"><rect width="880" height="540" fill="#12233f"/><text x="56" y="48" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="bold" fill="#a9c6ea">The wall is the runtime, not the qubit count</text><text x="56" y="72" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#9db3cf">Fault-tolerant T-gate count per kernel — the equilibrium solve alone is ~5,700 years at a megahertz no machine has shown.</text><line x1="110" y1="444.0" x2="820" y2="444.0" stroke="#2c4466"/><text x="102" y="448.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">10^12</text><line x1="110" y1="390.0" x2="820" y2="390.0" stroke="#2c4466"/><text x="102" y="394.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">10^13</text><line x1="110" y1="336.0" x2="820" y2="336.0" stroke="#2c4466"/><text x="102" y="340.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">10^14</text><line x1="110" y1="282.0" x2="820" y2="282.0" stroke="#2c4466"/><text x="102" y="286.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">10^15</text><line x1="110" y1="228.0" x2="820" y2="228.0" stroke="#2c4466"/><text x="102" y="232.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">10^16</text><line x1="110" y1="174.0" x2="820" y2="174.0" stroke="#2c4466"/><text x="102" y="178.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">10^17</text><line x1="110" y1="120.0" x2="820" y2="120.0" stroke="#2c4466"/><text x="102" y="124.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="10" fill="#9db3cf">10^18</text><rect x="168.3" y="383.8" width="120" height="60.2" fill="#a9c6ea"/><text x="228.3" y="375.8" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="13" font-weight="bold" fill="#e8eef7">1.3e+13</text><text x="228.3" y="464.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">K1</text><text x="228.3" y="479.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">Vlasov / kinetic</text><rect x="405.0" y="282.0" width="120" height="162.0" fill="#6b4a86"/><text x="465.0" y="274.0" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="13" font-weight="bold" fill="#e8eef7">1.0e+15</text><text x="465.0" y="464.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">K3</text><text x="465.0" y="479.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">first-wall materials</text><rect x="641.7" y="160.2" width="120" height="283.8" fill="#e0895a"/><text x="701.7" y="152.2" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="13" font-weight="bold" fill="#e8eef7">1.8e+17</text><text x="701.7" y="464.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">K2</text><text x="701.7" y="479.0" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#e8eef7">equilibrium linear solve</text><text x="34" y="282" transform="rotate(-90 34 282)" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#e8eef7">fault-tolerant T-gate count (log)</text></svg>