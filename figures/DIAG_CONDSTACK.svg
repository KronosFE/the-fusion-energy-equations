<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620"><rect width="940" height="620" fill="#12233f"/><text x="56" y="48" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="bold" fill="#a9c6ea">The SMART multilayer REBCO conductor</text><text x="56" y="74" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#9db3cf">A designed seven-function stack — each layer earns its place; order is build sequence, thickness not to scale.</text><rect x="150" y="104" width="300" height="52" fill="#e0895a" opacity="0.9"/><text x="300.0" y="135" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">MP35N reinforcement lam.</text><text x="136" y="134" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">~40 µm</text><text x="466" y="134" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">work-hardened, non-magnetic; post-growth hoop reinforcement</text><rect x="150" y="162" width="300" height="52" fill="#9db3cf" opacity="0.9"/><text x="300.0" y="193" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Hastelloy C-276 substrate</text><text x="136" y="192" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">~12 µm</text><text x="466" y="192" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">growth substrate (survives 700–800 °C MOCVD)</text><rect x="150" y="220" width="300" height="52" fill="#6bbf95" opacity="0.9"/><text x="300.0" y="251" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Buffer stack</text><text x="136" y="250" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">~4 µm</text><text x="466" y="250" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">IBAD-MgO + YSZ/CeO₂; biaxial texture template</text><rect x="150" y="278" width="300" height="52" fill="#a9c6ea" opacity="0.9"/><text x="300.0" y="309" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">REBCO</text><text x="136" y="308" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">~9 µm</text><text x="466" y="308" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">epitaxial superconductor (carries the current)</text><rect x="150" y="336" width="300" height="52" fill="#6d82a0" opacity="0.9"/><text x="300.0" y="367" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Ag cap</text><text x="136" y="366" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">~3 µm</text><text x="466" y="366" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">sputtered contact / oxygen-exchange cap</text><rect x="150" y="394" width="300" height="52" fill="#6b4a86" opacity="0.9"/><text x="300.0" y="425" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">V₂O₃ 'smart' quench layer</text><text x="136" y="424" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">~6 µm</text><text x="466" y="424" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">Mott MIT: insulating 4–20 K, shares current on heating</text><rect x="150" y="452" width="300" height="52" fill="#9db3cf" opacity="0.9"/><text x="300.0" y="483" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Graphene-Al bypass</text><text x="136" y="482" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">~12 µm</text><text x="466" y="482" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">high-purity Al + graphene; cryo heat-spreading</text><rect x="150" y="510" width="300" height="52" fill="#b8752e" opacity="0.9"/><text x="300.0" y="541" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Cu stabilizer</text><text x="136" y="540" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">~50 µm</text><text x="466" y="540" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#e8eef7">electroplated; main parallel current path / stability</text></svg>