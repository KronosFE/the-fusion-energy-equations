<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040"><rect width="760" height="1040" fill="#12233f"/><text x="380.0" y="70" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="13" letter-spacing="5" fill="#d9b463">THE ROAD · 2026 → 2050</text><text x="380.0" y="104" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="22" fill="#e8eef7">One chain, each gate earned by the last</text><line x1="150" y1="170" x2="150" y2="970.0" stroke="#9db3cf" stroke-width="2"/><circle cx="150" cy="170.0" r="11" fill="#12233f" stroke="#a9c6ea" stroke-width="3"/><text x="122" y="177.0" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" fill="#a9c6ea">2026</text><text x="184" y="166.0" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8eef7">Design closed & published</text><text x="184" y="188.0" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#6d82a0">Solved on paper, open-access, reproducible. No hardware yet.</text><circle cx="150" cy="303.33333333333337" r="11" fill="#12233f" stroke="#a9c6ea" stroke-width="3"/><text x="122" y="310.33333333333337" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" fill="#a9c6ea">2027</text><text x="184" y="299.33333333333337" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8eef7">Breeder construction begins</text><text x="184" y="321.33333333333337" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#6d82a0">Q2. The foundry is committed — build begins, not net gain.</text><circle cx="150" cy="436.6666666666667" r="11" fill="#12233f" stroke="#a9c6ea" stroke-width="3"/><text x="122" y="443.6666666666667" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" fill="#a9c6ea">2030</text><text x="184" y="432.6666666666667" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8eef7">First tritium</text><text x="184" y="454.6666666666667" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#6d82a0">First hardware operation (target; 2031 planning basis).</text><circle cx="150" cy="570.0" r="11" fill="#12233f" stroke="#a9c6ea" stroke-width="3"/><text x="122" y="577.0" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" fill="#a9c6ea">2032</text><text x="184" y="566.0" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8eef7">First test burner</text><text x="184" y="588.0" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#6d82a0">~100 MW demonstrator — proves the mirror physics.</text><circle cx="150" cy="703.3333333333334" r="11" fill="#12233f" stroke="#a9c6ea" stroke-width="3"/><text x="122" y="710.3333333333334" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" fill="#a9c6ea">2036</text><text x="184" y="699.3333333333334" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8eef7">Commercial fleet begins</text><text x="184" y="721.3333333333334" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#6d82a0">Gigawatt-class burners (Aegis, MetroVolt).</text><circle cx="150" cy="836.6666666666667" r="15" fill="#12233f" stroke="#d9b463" stroke-width="3"/><circle cx="150" cy="836.6666666666667" r="5" fill="#d9b463"/><text x="122" y="843.6666666666667" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" fill="#a9c6ea">2040</text><text x="184" y="832.6666666666667" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8eef7">Lunar helium-3</text><text x="184" y="854.6666666666667" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#6d82a0">The fuel constraint lifts. The Moon becomes the fuel depot.</text><circle cx="150" cy="970.0" r="11" fill="#12233f" stroke="#a9c6ea" stroke-width="3"/><text x="122" y="977.0" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" fill="#a9c6ea">2050</text><text x="184" y="966.0" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8eef7">Fleet at scale</text><text x="184" y="988.0" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#6d82a0">~90 units, ~90 GW. A deliberately small number of breeders.</text><text x="380.0" y="1010" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="#6d82a0">PROMISED WITHIN 40 YEARS · PLANNED FOR ~2050</text></svg>