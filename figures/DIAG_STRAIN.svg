<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560"><rect width="940" height="560" fill="#12233f"/><text x="72" y="50" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="bold" fill="#e8eef7">The coil gate, retired</text><text x="72" y="76" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#9db3cf">Inner-turn strain as a fraction of the conductor&#8217;s cap — the naive winding fails; the stress-managed winding closes with room to spare.</text><line x1="110" y1="464.0" x2="870" y2="464.0" stroke="#2c4466"/><text x="100" y="468.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">0&#215;</text><line x1="110" y1="414.9" x2="870" y2="414.9" stroke="#2c4466"/><text x="100" y="418.9" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">1&#215;</text><line x1="110" y1="365.7" x2="870" y2="365.7" stroke="#2c4466"/><text x="100" y="369.7" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">2&#215;</text><line x1="110" y1="316.6" x2="870" y2="316.6" stroke="#2c4466"/><text x="100" y="320.6" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">3&#215;</text><line x1="110" y1="267.4" x2="870" y2="267.4" stroke="#2c4466"/><text x="100" y="271.4" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">4&#215;</text><line x1="110" y1="218.3" x2="870" y2="218.3" stroke="#2c4466"/><text x="100" y="222.3" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">5&#215;</text><line x1="110" y1="169.1" x2="870" y2="169.1" stroke="#2c4466"/><text x="100" y="173.1" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">6&#215;</text><line x1="110" y1="120.0" x2="870" y2="120.0" stroke="#2c4466"/><text x="100" y="124.0" text-anchor="end" font-family="'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#9db3cf">7&#215;</text><text x="30" y="292" transform="rotate(-90 30 292)" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#e8eef7">strain ÷ irreversible-strain cap</text><rect x="215.0" y="144.6" width="170" height="93.4" fill="#e0895a"/><rect x="215.0" y="237.9" width="170" height="226.1" fill="#e0895a" opacity="0.22"/><text x="300.0" y="134.6" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="14" font-weight="bold" fill="#e8eef7">4.6&#8211;6.5&#215;</text><text x="300.0" y="486" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#e8eef7">Naive winding</text><text x="300.0" y="504" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10" fill="#9db3cf">over the cap — unbuildable as specified</text><rect x="595.0" y="445.8" width="170" height="6.0" fill="#6bbf95"/><rect x="595.0" y="451.2" width="170" height="12.8" fill="#6bbf95" opacity="0.22"/><text x="680.0" y="435.8" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="14" font-weight="bold" fill="#e8eef7">0.26&#8211;0.37&#215;</text><text x="680.0" y="486" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#e8eef7">Stress-managed winding</text><text x="680.0" y="504" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10" fill="#9db3cf">segmented, pre-compressed, shield as structure</text><line x1="110" y1="414.9" x2="870" y2="414.9" stroke="#e8eef7" stroke-width="2" stroke-dasharray="7 5"/><text x="864" y="406.9" text-anchor="end" font-family="system-ui,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e8eef7">the cap · 1.0&#215;</text><text x="490" y="179" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="13" fill="#9db3cf">one gate remains at the plug — and it is physics, not engineering</text></svg>