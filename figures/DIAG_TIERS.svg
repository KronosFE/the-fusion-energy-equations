<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470"><rect width="980" height="470" fill="#12233f"/><text x="48" y="52" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="bold" fill="#a9c6ea">Three tiers of &#8220;compute,&#8221; honestly ordered</text><text x="48" y="78" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#9db3cf">What is usable now, what is near, and what is oversold — kept in separate lanes on one timeline.</text><line x1="300" y1="394" x2="300" y2="400" stroke="#9db3cf"/><text x="300" y="420" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" fill="#9db3cf">now</text><line x1="455" y1="394" x2="455" y2="400" stroke="#9db3cf"/><text x="455" y="420" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" fill="#9db3cf">2030</text><line x1="610" y1="394" x2="610" y2="400" stroke="#9db3cf"/><text x="610" y="420" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" fill="#9db3cf">2035</text><line x1="765" y1="394" x2="765" y2="400" stroke="#9db3cf"/><text x="765" y="420" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" fill="#9db3cf">2040</text><line x1="920" y1="394" x2="920" y2="400" stroke="#9db3cf"/><text x="920" y="420" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,monospace" font-size="12" fill="#9db3cf">2045</text><line x1="300" y1="400" x2="920" y2="400" stroke="#9db3cf" stroke-width="1.4"/><text x="48" y="148" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="bold" fill="#a9c6ea">Physics-informed AI</text><text x="48" y="168" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">in the control loop now, under a deterministic clamp</text><text x="48" y="188" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9" letter-spacing="1.5" fill="#d9b463">DEPLOYABLE NOW</text><rect x="300" y="143" width="620" height="18" rx="9" fill="#d9b463" opacity="0.9"/><circle cx="300" cy="152" r="6" fill="#d9b463"/><text x="48" y="236" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="bold" fill="#a9c6ea">Quantum sensing</text><text x="48" y="256" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">diagnostics — magnetometry, precision measurement</text><text x="48" y="276" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9" letter-spacing="1.5" fill="#9db3cf">NEAR-TERM</text><rect x="393" y="231" width="527" height="18" rx="9" fill="#9db3cf" opacity="0.9"/><circle cx="393" cy="240" r="6" fill="#9db3cf"/><text x="48" y="324" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="bold" fill="#a9c6ea">Quantum computing</text><text x="48" y="344" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#9db3cf">no near-decade advantage — off the critical path</text><text x="48" y="364" font-family="'IBM Plex Mono',Menlo,monospace" font-size="9" letter-spacing="1.5" fill="#6d82a0">NOT SOON, NOT NEEDED</text><rect x="703" y="319" width="217" height="18" rx="9" fill="none" stroke="#6d82a0" stroke-width="2" stroke-dasharray="6 5"/><circle cx="703" cy="328" r="6" fill="#6d82a0"/><text x="610" y="446" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="14" fill="#a9c6ea">The control room runs on the top lane today. The bottom lane is a promise the field likes to borrow against.</text></svg>